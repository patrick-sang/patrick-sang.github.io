<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey — Patrick Sang | GIS Developer, Nairobi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2ec;
    --ink:#12302f;
    --mute:#4d6362;
    --card:#fbfcf9;
    --line:#cfd9d0;
    --accent:#c9540a;
    --deep:#0f3d3e;
    --on-deep:#e8f0ea;
    --sand:#e3ead9;

    }
  }
  :root[data-theme=dark]{
    --bg:#0e1f1f;
    --ink:#e3ece6;
    --mute:#9db3b0;
    --card:#142a29;
    --line:#274241;
    --accent:#f08a4b;
    --deep:#0a1818;
    --on-deep:#e3ece6;
    --sand:#172f2e;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:70px}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:17px/1.65 "IBM Plex Sans",system-ui,sans-serif;
  }

  h1,h2,h3,h4{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    line-height:1.12;
    margin:0 0 .5em;
    letter-spacing:-.01em;
  }
  h2{font-size:clamp(1.9rem,4vw,2.9rem)}
  h3{font-size:1.3rem}
  p{margin:0 0 1em;max-width:68ch}
  a{color:inherit}

  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  section{padding:84px 0}
  .lede{color:var(--mute);font-size:1.1rem}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ===== JOURNEY / TIMELINE ===== */
  .timeline{
    margin-top:34px;
    border-left:2px solid var(--accent);
    padding-left:26px;
    margin-left:0;
    display:grid;
    gap:30px;
  }
  .timeline li{
    list-style:none;
    position:relative;
  }
  .timeline li::before{
    content:"";
    position:absolute;
    left:-34px;
    top:8px;
    width:14px;
    height:14px;
    background:var(--bg);
    border:3px solid var(--accent);
    border-radius:50%;
  }
  .timeline time{
    font-weight:500;
    color:var(--accent);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:1rem;
  }
  .timeline h3{
    margin-top:2px;
    color:var(--ink);
  }
  .timeline p{
    color:var(--mute);
    font-size:.97rem;
    margin:4px 0 0;
  }
</style>
</head>
<body>

<section id="journey">
  <div class="wrap">
    <h2>Journey</h2>
    <p class="lede">How I got from maps on paper to production geospatial systems.</p>
    <ol class="timeline" id="tl"></ol>
  </div>
</section>

<script>
  /* ===== EDIT YOUR JOURNEY HERE ===== */
  const JOURNEY = [
    { when: "Year", title: "Where it started", text: "Add the moment you first got into maps, GIS or surveying." },
    { when: "Year", title: "First professional GIS role", text: "Add the organisation, what you built and what you learned." },
    { when: "Year", title: "Going independent", text: "Add when you started taking client work and the first clients you served." },
    { when: "Year", title: "Scaling the stack", text: "Moving from desktop GIS to PostGIS, web mapping, Airflow pipelines and GeoAI." },
    { when: "Now", title: "Figuring out what geospatial can do", text: "Routing, spatial regression, remote sensing and dashboards for businesses across Kenya." }
  ];
  /* ===== END EDIT ===== */

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  document.getElementById("tl").innerHTML = JOURNEY.map(j => `
    <li>
      <time>${esc(j.when)}</time>
      <h3>${esc(j.title)}</h3>
      <p>${esc(j.text)}</p>
    </li>
  `).join("");
</script>

</body>
</html>
