<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift Valley Lake &amp; Flood Exposure Monitor</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; }
    #map { position: absolute; inset: 0; }

    .panel {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(15, 23, 42, 0.94); color: #f8fafc;
      padding: 16px; border-radius: 12px; width: 300px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    .panel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
    .subtitle { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
    .meta-tag {
      font-size: 10px; color: #94a3b8; margin-bottom: 10px;
      background: rgba(30, 41, 59, 0.75); padding: 6px 8px; border-radius: 6px;
      line-height: 1.45;
    }

    .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    label {
      font-size: 11px; font-weight: 600; color: #cbd5e1;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    select, button {
      padding: 8px 10px; border-radius: 7px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 13px; width: 100%;
    }
    button {
      background: #0284c7; border: none; font-weight: 600; cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .legend {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 11px; color: #cbd5e1;
    }
    .legend-bar {
      height: 8px; border-radius: 4px; margin: 5px 0;
      background: linear-gradient(90deg, #38bdf8 0%, #f59e0b 50%, #dc2626 100%);
    }
    .legend-labels { display: flex; justify-content: space-between; color: #94a3b8; font-size: 10px; }
    .legend-point { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #111827; border: 1.5px solid #f8fafc; display: inline-block;
    }

    #status { font-size: 11px; color: #7dd3fc; margin-top: 10px; line-height: 1.4; }
    .stats {
      margin-top: 8px; padding: 8px; border-radius: 6px;
      background: rgba(30, 41, 59, 0.8); font-size: 11px; color: #e2e8f0;
      display: none;
    }

    @media (max-width: 600px) {
      .panel { width: calc(100% - 28px); top: auto; bottom: 14px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h3>Rift Valley Lake Monitor</h3>
    <p class="subtitle">DE Africa WOfS + OSM Infrastructure Exposure</p>
    <div class="meta-tag">
      Token: <strong>fc_3sqK2q2tjzM97dn1wLHoP6</strong><br/>
      UDFs: <code>lake_water_change</code>, <code>lake_flood_exposure</code>
    </div>

    <div class="row">
      <label for="basemap">Open Basemap Style</label>
      <select id="basemap" onchange="switchBasemap()">
        <option value="https://tiles.openfreemap.org/styles/liberty" selected>OpenFreeMap Liberty</option>
        <option value="https://tiles.openfreemap.org/styles/bright">OpenFreeMap Bright</option>
        <option value="https://tiles.openfreemap.org/styles/dark">OpenFreeMap Dark</option>
      </select>
    </div>

    <div class="row">
      <label for="lake">Lake Basin</label>
      <select id="lake">
        <option value="naivasha">Lake Naivasha</option>
        <option value="nakuru">Lake Nakuru</option>
        <option value="baringo">Lake Baringo</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="row" style="margin-bottom:0;">
        <label for="baseline">Baseline</label>
        <select id="baseline">
          <option value="2016" selected>2016</option>
          <option value="2018">2018</option>
          <option value="2020">2020</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:0;">
        <label for="target">Target</label>
        <select id="target">
          <option value="2022">2022</option>
          <option value="2024" selected>2024</option>
          <option value="2026">2026</option>
        </select>
      </div>
    </div>

    <button id="runBtn" onclick="loadLayers()">Run Analysis</button>
    <div id="stats" class="stats"></div>
    <div id="status">Ready — click Run Analysis to query your UDFs.</div>

    <div class="legend">
      <div><strong>Shoreline Expansion Index</strong></div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>Low (0.0)</span>
        <span>Moderate (0.5)</span>
        <span>High (1.0)</span>
      </div>
      <div class="legend-point">
        <span class="dot"></span>
        <span>OSM Roads, Schools &amp; Clinics</span>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      token: "fc_3sqK2q2tjzM97dn1wLHoP6",
      baseUrl: "https://udf.ai",
      udfs: {
        water: "lake_water_change",
        infra: "lake_flood_exposure"
      }
    };

    const centers = {
      naivasha: [36.34, -0.77, 10.5],
      nakuru: [36.08, -0.36, 11.0],
      baringo: [36.07, 0.61, 10.0]
    };

    const clientCache = new Map();
    let latestWaterData = { type: "FeatureCollection", features: [] };
    let latestInfraData = { type: "FeatureCollection", features: [] };

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [36.34, -0.77],
      zoom: 10.5
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    function addOverlayLayers() {
      if (!map.getSource("water-hex")) {
        map.addSource("water-hex", { type: "geojson", data: latestWaterData });
      } else {
        map.getSource("water-hex").setData(latestWaterData);
      }

      if (!map.getLayer("water-hex-fill")) {
        map.addLayer({
          id: "water-hex-fill",
          type: "fill",
          source: "water-hex",
          paint: {
            "fill-color": [
              "interpolate", ["linear"], ["get", "expansion_index"],
              0, "#38bdf8",
              0.5, "#f59e0b",
              1.0, "#dc2626"
            ],
            "fill-opacity": 0.45
          }
        });
      }

      if (!map.getLayer("water-hex-outline")) {
        map.addLayer({
          id: "water-hex-outline",
          type: "line",
          source: "water-hex",
          paint: {
            "line-color": "#0f172a",
            "line-width": 0.4,
            "line-opacity": 0.35
          }
        });
      }

      if (!map.getSource("infra-pts")) {
        map.addSource("infra-pts", { type: "geojson", data: latestInfraData });
      } else {
        map.getSource("infra-pts").setData(latestInfraData);
      }

      if (!map.getLayer("infra-pts-circle")) {
        map.addLayer({
          id: "infra-pts-circle",
          type: "circle",
          source: "infra-pts",
          paint: {
            "circle-radius": 5,
            "circle-color": "#111827",
            "circle-stroke-color": "#f8fafc",
            "circle-stroke-width": 1.5
          }
        });
      }
    }

    function switchBasemap() {
      const styleUrl = document.getElementById("basemap").value;
      map.setStyle(styleUrl);
      map.once("style.load", addOverlayLayers);
    }

    function applyUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const lakeParam = params.get("lake");
      if (lakeParam && centers[lakeParam]) {
        document.getElementById("lake").value = lakeParam;
        const [lon, lat, zoom] = centers[lakeParam];
        map.jumpTo({ center: [lon, lat], zoom });
      }
      const baseParam = params.get("baseline_year");
      if (baseParam && [...document.getElementById("baseline").options].some(o => o.value === baseParam)) {
        document.getElementById("baseline").value = baseParam;
      }
      const targetParam = params.get("target_year");
      if (targetParam && [...document.getElementById("target").options].some(o => o.value === targetParam)) {
        document.getElementById("target").value = targetParam;
      }
    }

    map.on("load", () => {
      addOverlayLayers();

      map.on("click", "infra-pts-circle", (e) => {
        const f = e.features[0];
        const p = f.properties;
        new maplibregl.Popup()
          .setLngLat(f.geometry.coordinates)
          .setHTML(`
            <div style="font-size:12px;color:#0f172a;">
              <strong>${p.name || "Infrastructure"}</strong><br/>
              Category: ${p.category || "N/A"}<br/>
              Exposure Score: <strong>${p.exposure_score ?? "N/A"}</strong>
            </div>
          `)
          .addTo(map);
      });

      map.on("click", "water-hex-fill", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`
            <div style="font-size:12px;color:#0f172a;">
              <strong>H3: ${p.hex}</strong><br/>
              Expansion Index: <strong>${p.expansion_index}</strong><br/>
              WOfS Scenes (${p.baseline_year} → ${p.target_year}): ${p.base_scenes} → ${p.curr_scenes}
            </div>
          `)
          .addTo(map);
      });

      map.on("mouseenter", "infra-pts-circle", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "infra-pts-circle", () => map.getCanvas().style.cursor = "");

      applyUrlParams();
    });

    async function fetchWithCache(url) {
      if (clientCache.has(url)) return clientCache.get(url);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      clientCache.set(url, data);
      return data;
    }

    function buildUdfEndpoint(udfName, lake, baselineYear, targetYear) {
      return `${CONFIG.baseUrl}/${CONFIG.token}/${udfName}.geojson?lake=${encodeURIComponent(lake)}&baseline_year=${baselineYear}&target_year=${targetYear}&cache_max_age=2592000`;
    }

    async function loadLayers() {
      const lake = document.getElementById("lake").value;
      const baseline_year = parseInt(document.getElementById("baseline").value, 10);
      const target_year = parseInt(document.getElementById("target").value, 10);
      const statusEl = document.getElementById("status");
      const statsEl = document.getElementById("stats");
      const btn = document.getElementById("runBtn");

      if (target_year <= baseline_year) {
        statusEl.textContent = "Target year must be later than baseline year.";
        return;
      }

      const [lon, lat, zoom] = centers[lake];
      map.flyTo({ center: [lon, lat], zoom });

      btn.disabled = true;
      try {
        statusEl.textContent = `Querying ${CONFIG.udfs.water} & ${CONFIG.udfs.infra}...`;

        const u1 = buildUdfEndpoint(CONFIG.udfs.water, lake, baseline_year, target_year);
        const u2 = buildUdfEndpoint(CONFIG.udfs.infra, lake, baseline_year, target_year);

        const [g1, g2] = await Promise.all([fetchWithCache(u1), fetchWithCache(u2)]);

        latestWaterData = g1;
        latestInfraData = g2;

        map.getSource("water-hex").setData(g1);
        map.getSource("infra-pts").setData(g2);

        const hexCount = g1.features ? g1.features.length : 0;
        const infraCount = g2.features ? g2.features.length : 0;

        statsEl.style.display = "block";
        statsEl.innerHTML = `<strong>${lake.toUpperCase()}</strong> (${baseline_year} → ${target_year})<br/>H3 Cells: ${hexCount} • Exposed Assets: ${infraCount}`;
        statusEl.textContent = "Loaded (cached in browser session & Fused 30d cache).";
      } catch (err) {
        statusEl.textContent = `Request failed: ${err.message} (verify canvas is shared and UDF names match).`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
