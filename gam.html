<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenya Urban Building Density &amp; Corridor WebGIS</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-border: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --err: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    #sidebar {
      width: 375px;
      min-width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 1000;
    }
    h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .subtitle { font-size: 0.76rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    select, input, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: var(--text);
      font-size: 0.84rem;
    }
    button.primary {
      background: var(--accent);
      color: #061320;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: #1e293b;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      border: 1px dashed #475569;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 0.78rem;
    }
    button:hover { filter: brightness(1.08); }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .kpi {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
    }
    .kpi .val { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .kpi .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    #detail-box {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cbd5e1;
    }
    #status-box {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
      color: var(--accent-2);
      line-height: 1.4;
      word-break: break-word;
    }
    #status-box.error { color: var(--err); border-color: #7f1d1d; }
    #status-box.warn { color: var(--warn); border-color: #78350f; }
    #map { flex: 1; height: 100%; background: #1e293b; }
    .legend {
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 0.75rem;
      line-height: 1.4;
    }
    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 2px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div>
      <h1>Kenya Building Density &amp; Corridor Mapper</h1>
      <div class="subtitle">Canvas <code>fc_1NQSFd3F8X3TKH596bGI16</code> · Keyless Basemaps</div>
    </div>

    <div class="control-group">
      <label for="basemap-provider">Open / Keyless Basemap</label>
      <select id="basemap-provider">
        <option value="esri_gray" selected>Esri Light Gray Canvas</option>
        <option value="osm">OpenStreetMap Standard</option>
        <option value="esri_imagery">Esri World Imagery (Satellite)</option>
        <option value="opentopomap">OpenTopoMap (Terrain)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="corridor-preset">Kenya Urban Corridor / Metro</label>
      <select id="corridor-preset">
        <option value="36.79,-1.31,36.85,-1.26" selected>Nairobi Central &amp; Upper Hill</option>
        <option value="36.78,-1.28,36.82,-1.24">Westlands &amp; Parklands Corridor</option>
        <option value="36.82,-1.35,36.88,-1.29">Mombasa Rd &amp; Industrial Area</option>
        <option value="34.74,-0.12,34.78,-0.08">Kisumu Central</option>
        <option value="36.05,-0.31,36.09,-0.26">Nakuru CBD</option>
      </select>
    </div>

    <div class="control-group">
      <label for="view-mode">Layer Mode</label>
      <select id="view-mode">
        <option value="hex" selected>H3 Density Aggregation (nairobi_building_hex)</option>
        <option value="buildings">Building Footprints (nairobi_corridor_buildings)</option>
      </select>
    </div>

    <div class="row-2">
      <div class="control-group">
        <label for="h3-res">H3 Resolution</label>
        <select id="h3-res">
          <option value="7">Res 7 (~5.16 km²)</option>
          <option value="8" selected>Res 8 (~0.74 km²)</option>
          <option value="9">Res 9 (~0.105 km²)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="release-tag">Overture Release</label>
        <input id="release-tag" type="text" value="2026-11-18.0" />
      </div>
    </div>

    <div class="control-group" id="class-filter-group" style="display:none;">
      <label for="building-class">Building Class Filter (Optional)</label>
      <input id="building-class" type="text" placeholder="e.g. commercial, residential, industrial" />
    </div>

    <div class="row-2">
      <button class="primary" id="btn-load-bbox">Query Fused UDF</button>
      <button class="secondary" id="btn-fit-corridor">Zoom Corridor</button>
    </div>

    <button class="ghost" id="btn-demo-preview">Load Local Preview Hexes (If Endpoint Blocked)</button>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="val" id="kpi-primary">—</div>
        <div class="lbl" id="kpi-primary-lbl">Active Hexes</div>
      </div>
      <div class="kpi">
        <div class="val" id="kpi-buildings">—</div>
        <div class="lbl">Total Buildings</div>
      </div>
      <div class="kpi">
        <div class="val" id="kpi-area">—</div>
        <div class="lbl">Footprint Area (m²)</div>
      </div>
      <div class="kpi">
        <div class="val" id="kpi-max-h">—</div>
        <div class="lbl">Max Height (m)</div>
      </div>
    </div>

    <div class="control-group">
      <label>Selected Feature Details</label>
      <div id="detail-box">Click an H3 hexagon or building footprint on the map to inspect attributes.</div>
    </div>

    <div class="control-group">
      <label>Endpoint &amp; Request Status</label>
      <div id="status-box">Initializing map...</div>
    </div>
  </aside>

  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script>
    const CANVAS_TOKEN = "fc_1NQSFd3F8X3TKH596bGI16";
    const HEX_UDF = "nairobi_building_hex";
    const BLDG_UDF = "nairobi_corridor_buildings";

    const map = L.map("map").setView([-1.285, 36.82], 13);
    const dataLayer = L.layerGroup().addTo(map);

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <strong>Density / Area Scale</strong><br/>
        <i style="background:#1d4ed8"></i>Low<br/>
        <i style="background:#06b6d4"></i>Moderate<br/>
        <i style="background:#eab308"></i>High<br/>
        <i style="background:#ef4444"></i>Very High
      `;
      return div;
    };
    legend.addTo(map);

    const basemapProviderEl = document.getElementById("basemap-provider");
    const presetEl = document.getElementById("corridor-preset");
    const modeEl = document.getElementById("view-mode");
    const h3ResEl = document.getElementById("h3-res");
    const releaseEl = document.getElementById("release-tag");
    const classFilterEl = document.getElementById("building-class");
    const classGroupEl = document.getElementById("class-filter-group");
    const statusEl = document.getElementById("status-box");
    const detailEl = document.getElementById("detail-box");

    let activeBasemapLayer = null;

    function setStatus(msg, level = "ok") {
      statusEl.textContent = msg;
      statusEl.className = level === "error" ? "error" : level === "warn" ? "warn" : "";
    }

    function createBasemapLayer(provider) {
      if (provider === "osm") {
        return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 19,
        });
      }
      if (provider === "esri_imagery") {
        return L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "&copy; Esri, Maxar, Earthstar Geographics",
            maxZoom: 19,
          }
        );
      }
      if (provider === "opentopomap") {
        return L.tileLayer("https://tile.opentopomap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors, SRTM | OpenTopoMap",
          maxZoom: 17,
        });
      }
      return L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "&copy; Esri, HERE, Garmin, OpenStreetMap contributors",
          maxZoom: 16,
        }
      );
    }

    function applyBasemap() {
      if (activeBasemapLayer) {
        map.removeLayer(activeBasemapLayer);
      }
      activeBasemapLayer = createBasemapLayer(basemapProviderEl.value);
      activeBasemapLayer.on("tileerror", () => {
        setStatus("A basemap tile failed to load; try switching the basemap dropdown above.", "warn");
      });
      activeBasemapLayer.addTo(map);
    }

    basemapProviderEl.addEventListener("change", applyBasemap);

    modeEl.addEventListener("change", () => {
      classGroupEl.style.display = modeEl.value === "buildings" ? "flex" : "none";
      runQuery();
    });

    document.getElementById("btn-fit-corridor").addEventListener("click", () => {
      const [minx, miny, maxx, maxy] = presetEl.value.split(",").map(Number);
      map.fitBounds([[miny, minx], [maxy, maxx]]);
    });

    document.getElementById("btn-load-bbox").addEventListener("click", () => {
      runQuery();
    });

    document.getElementById("btn-demo-preview").addEventListener("click", () => {
      const center = map.getCenter();
      const res = Number(h3ResEl.value) || 8;
      const rootHex = h3.latlngToCell(center.lat, center.lng, res);
      const ring = h3.gridDisk(rootHex, 1);
      const sampleRows = ring.map((hexId, idx) => ({
        hex: hexId,
        building_count: 140 + idx * 85,
        total_footprint_m2: 24500 + idx * 11200,
        avg_footprint_m2: 175 + idx * 12,
        max_height_m: 18 + idx * 7,
      }));
      renderHexRows(sampleRows, "Local preview H3 cells rendered (offline/fallback mode).");
    });

    presetEl.addEventListener("change", () => {
      const [minx, miny, maxx, maxy] = presetEl.value.split(",").map(Number);
      map.fitBounds([[miny, minx], [maxy, maxx]]);
      runQuery();
    });

    function getColor(ratio) {
      if (ratio > 0.75) return "#ef4444";
      if (ratio > 0.45) return "#eab308";
      if (ratio > 0.20) return "#06b6d4";
      return "#1d4ed8";
    }

    function getCurrentBboxJson() {
      const b = map.getBounds();
      return JSON.stringify([
        Number(b.getWest().toFixed(5)),
        Number(b.getSouth().toFixed(5)),
        Number(b.getEast().toFixed(5)),
        Number(b.getNorth().toFixed(5)),
      ]);
    }

    function buildUdfUrl(udfName, params) {
      const cleanParams = Object.fromEntries(
        Object.entries(params).filter(([, v]) => v !== "" && v !== undefined && v !== null)
      );
      const usp = new URLSearchParams(cleanParams);
      return `https://udf.ai/${CANVAS_TOKEN}/${udfName}.json?${usp.toString()}`;
    }

    function renderHexRows(rows, statusText) {
      dataLayer.clearLayers();
      if (!Array.isArray(rows) || rows.length === 0) {
        updateKpis(0, 0, 0, null, "Active Hexes");
        setStatus("No building hexes returned for this viewport.", "warn");
        return;
      }

      const maxCount = Math.max(...rows.map(r => Number(r.building_count) || 0), 1);
      let totalBldgs = 0;
      let totalArea = 0;
      let maxH = null;
      let rendered = 0;

      rows.forEach((row) => {
        if (!row.hex || !h3.isValidCell(row.hex)) return;
        const count = Number(row.building_count) || 0;
        const area = Number(row.total_footprint_m2) || 0;
        const h = row.max_height_m != null && !Number.isNaN(Number(row.max_height_m))
          ? Number(row.max_height_m)
          : null;

        totalBldgs += count;
        totalArea += area;
        if (h !== null && (maxH === null || h > maxH)) maxH = h;

        const boundary = h3.cellToBoundary(row.hex, true);
        const poly = L.polygon(
          boundary.map(([lng, lat]) => [lat, lng]),
          {
            color: "#1e293b",
            weight: 1.2,
            fillColor: getColor(count / maxCount),
            fillOpacity: 0.62,
          }
        );

        poly.on("click", () => {
          detailEl.innerHTML = `
            <strong>H3 Cell:</strong> <code>${row.hex}</code><br/>
            <strong>Buildings:</strong> ${count.toLocaleString()}<br/>
            <strong>Total Footprint:</strong> ${area.toLocaleString()} m²<br/>
            <strong>Avg Footprint:</strong> ${(Number(row.avg_footprint_m2) || 0).toLocaleString()} m²<br/>
            <strong>Max Height:</strong> ${h !== null ? `${h} m` : "N/A"}
          `;
        });
        poly.addTo(dataLayer);
        rendered += 1;
      });

      updateKpis(rendered, totalBldgs, Math.round(totalArea), maxH, "Active Hexes");
      setStatus(statusText || `Loaded ${rendered} H3 cells.`);
    }

    function renderBuildingGeoJson(geojson) {
      dataLayer.clearLayers();
      const features = Array.isArray(geojson?.features) ? geojson.features : [];
      if (features.length === 0) {
        updateKpis(0, 0, 0, null, "Footprints");
        setStatus("No building footprints returned for this viewport.", "warn");
        return;
      }

      const maxArea = Math.max(...features.map(f => Number(f.properties?.area_m2) || 0), 1);
      let totalArea = 0;
      let maxH = null;

      const gjLayer = L.geoJSON(geojson, {
        style: (feat) => {
          const a = Number(feat.properties?.area_m2) || 0;
          return {
            color: "#1e293b",
            weight: 1,
            fillColor: getColor(a / maxArea),
            fillOpacity: 0.7,
          };
        },
        onEachFeature: (feat, layer) => {
          const p = feat.properties || {};
          const a = Number(p.area_m2) || 0;
          const h = p.height_m != null && !Number.isNaN(Number(p.height_m))
            ? Number(p.height_m)
            : null;
          totalArea += a;
          if (h !== null && (maxH === null || h > maxH)) maxH = h;

          layer.on("click", () => {
            const centroid = turf.centroid(feat).geometry.coordinates;
            detailEl.innerHTML = `
              <strong>Name:</strong> ${p.primary_name || "Unnamed"}<br/>
              <strong>Class:</strong> ${p.building_class || "N/A"}<br/>
              <strong>Area:</strong> ${a.toLocaleString()} m²<br/>
              <strong>Height / Floors:</strong> ${h !== null ? `${h} m` : "N/A"} / ${p.num_floors ?? "N/A"}<br/>
              <strong>Centroid:</strong> ${centroid[1].toFixed(5)}, ${centroid[0].toFixed(5)}
            `;
          });
        },
      });

      gjLayer.addTo(dataLayer);
      updateKpis(features.length, features.length, Math.round(totalArea), maxH, "Footprints");
      setStatus(`Loaded ${features.length} building footprints.`);
    }

    async function runQuery() {
      const bboxJson = getCurrentBboxJson();
      const release = releaseEl.value.trim() || "2026-11-18.0";
      const mode = modeEl.value;
      const targetUdf = mode === "hex" ? HEX_UDF : BLDG_UDF;
      const params = mode === "hex"
        ? { bbox: bboxJson, h3_res: Number(h3ResEl.value), release }
        : { bbox: bboxJson, building_class: classFilterEl.value.trim(), release };

      const url = buildUdfUrl(targetUdf, params);
      setStatus(`Requesting ${url}`);

      try {
        const res = await fetch(url);
        const bodyText = await res.text();
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} — ${bodyText.slice(0, 220)}`);
        }
        const parsed = JSON.parse(bodyText);
        if (mode === "hex") {
          renderHexRows(parsed, `Loaded ${Array.isArray(parsed) ? parsed.length : 0} H3 cells from Fused.`);
        } else {
          renderBuildingGeoJson(parsed);
        }
      } catch (err) {
        setStatus(
          `Fetch failed (${err.message}). Confirm canvas fc_1NQSFd3F8X3TKH596bGI16 is shared, UDF "${targetUdf}" exists on it, and CORS allows this origin—or click "Load Local Preview Hexes" above.`,
          "error"
        );
      }
    }

    function updateKpis(primaryVal, bldgs, area, maxH, primaryLabel) {
      document.getElementById("kpi-primary").textContent = primaryVal.toLocaleString();
      document.getElementById("kpi-primary-lbl").textContent = primaryLabel;
      document.getElementById("kpi-buildings").textContent = bldgs.toLocaleString();
      document.getElementById("kpi-area").textContent = area.toLocaleString();
      document.getElementById("kpi-max-h").textContent = maxH !== null ? `${maxH} m` : "N/A";
    }

    applyBasemap();
    runQuery();
  </script>
</body>
</html>
