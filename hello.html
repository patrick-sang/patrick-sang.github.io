<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rift Valley Lake &amp; Flood Exposure Monitor</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Rift%20Valley%20Lake%20Monitor%22%2C%22short_name%22%3A%22RiftMonitor%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    #map { position: absolute; inset: 0; }

    .panel { position: absolute; top: 14px; left: 14px; z-index: 10; background: rgba(15, 23, 42, 0.94); color: #f8fafc; padding: 16px; border-radius: 12px; width: 300px; max-height: calc(100% - 28px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; border: 1px solid rgba(148, 163, 184, 0.2); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4); }
    .panel h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; padding-right: 34px; }
    .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    label { font-size: 11px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.03em; }
    select, button { padding: 8px 10px; border-radius: 7px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 13px; width: 100%; font-family: inherit; min-height: 38px; }
    button { background: #0284c7; border: none; font-weight: 600; cursor: pointer; transition: background 0.15s ease; }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .panel-toggle { display: none; position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; min-height: 30px; padding: 0; border-radius: 50%; background: rgba(51, 65, 85, 0.9); border: 1px solid rgba(148, 163, 184, 0.35); color: #e2e8f0; font-size: 13px; line-height: 1; align-items: center; justify-content: center; }
    .panel-toggle:hover { background: rgba(71, 85, 105, 0.95); }
    .legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(148, 163, 184, 0.2); font-size: 11px; color: #cbd5e1; }
    .legend-bar { height: 8px; border-radius: 4px; margin: 5px 0; background: linear-gradient(90deg, #38bdf8 0%, #f59e0b 50%, #dc2626 100%); }
    .legend-labels { display: flex; justify-content: space-between; color: #94a3b8; font-size: 10px; gap: 6px; }
    .legend-point { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #111827; border: 1.5px solid #f8fafc; display: inline-block; flex: 0 0 auto; }
    #status { font-size: 11px; color: #7dd3fc; margin-top: 10px; line-height: 1.4; overflow-wrap: anywhere; }
    .stats { margin-top: 8px; padding: 8px; border-radius: 6px; background: rgba(30, 41, 59, 0.8); font-size: 11px; color: #e2e8f0; display: none; }
    .tools { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(148, 163, 184, 0.2); font-size: 11px; color: #cbd5e1; }
    .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
    .tools-grid button { font-size: 11px; padding: 7px 8px; min-height: 34px; background: #1e293b; border: 1px solid #334155; }
    .tools-grid button:hover { background: #334155; }

    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal[hidden] { display: none; }
    .modal-content { background: #0f172a; color: #f8fafc; padding: 20px; border-radius: 12px; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; border: 1px solid rgba(148, 163, 184, 0.25); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
    .modal-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; padding: 0; min-height: 0; line-height: 1; }
    .modal-close:hover { color: #f8fafc; background: transparent; }
    .modal h3 { margin: 0 0 12px; font-size: 15px; padding-right: 34px; }
    .modal p { line-height: 1.55; font-size: 13px; color: #cbd5e1; }
    .modal button { margin-top: 6px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .tbl th, .tbl td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(148, 163, 184, 0.2); }
    .tbl th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }
    .bm-list { list-style: none; padding: 0; margin: 10px 0 0; }
    .bm-list li { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; background: rgba(30, 41, 59, 0.6); margin-bottom: 6px; font-size: 13px; }
    .bm-list a { color: #7dd3fc; text-decoration: none; }
    .bm-list .bm-del { width: 26px; height: 26px; min-height: 0; padding: 0; background: transparent; color: #94a3b8; font-size: 16px; border: none; }
    .bm-list .bm-del:hover { color: #f8fafc; background: transparent; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #f8fafc; padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; border: 1px solid rgba(148, 163, 184, 0.2); max-width: calc(100vw - 40px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) { .panel { width: 280px; padding: 14px; } }
    @media (max-width: 600px) {
      .panel { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 52vh; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-radius: 16px 16px 0 0; border-left: none; border-right: none; border-bottom: none; box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.45); }
      .panel h3 { font-size: 16px; }
      .panel-toggle { display: flex; }
      select, button { font-size: 16px; padding: 10px 12px; min-height: 44px; }
      label { font-size: 12px; }
      .panel.collapsed { max-height: none; }
      .panel.collapsed .panel-body { display: none; }
      .tools-grid button { font-size: 13px; min-height: 40px; }
      .modal-content { max-height: 88vh; padding: 16px; }
    }
    @media (max-width: 380px) { .panel { padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); } .grid-2 { gap: 6px; } .legend-labels { font-size: 9px; } }
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 520px) {
      .panel { top: 10px; left: 10px; right: auto; bottom: auto; width: 260px; max-height: calc(100% - 20px); padding: 12px; border-radius: 12px; border-left: 1px solid rgba(148, 163, 184, 0.2); border-right: 1px solid rgba(148, 163, 184, 0.2); border-bottom: 1px solid rgba(148, 163, 184, 0.2); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <button id="panelToggle" class="panel-toggle" type="button" aria-label="Collapse panel" aria-expanded="true" aria-controls="panelBody">▾</button>
    <h3>Rift Valley Lake Monitor</h3>
    <div class="panel-body" id="panelBody">
      <div class="row">
        <label for="basemap">Basemap</label>
        <select id="basemap">
          <option value="https://tiles.openfreemap.org/styles/liberty" selected>OpenFreeMap Liberty</option>
          <option value="https://tiles.openfreemap.org/styles/bright">OpenFreeMap Bright</option>
          <option value="https://tiles.openfreemap.org/styles/dark">OpenFreeMap Dark</option>
        </select>
      </div>
      <div class="row">
        <label for="lake">Lake Basin</label>
        <select id="lake">
          <option value="naivasha">Lake Naivasha</option>
          <option value="nakuru">Lake Nakuru</option>
          <option value="baringo">Lake Baringo</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="row" style="margin-bottom:0;">
          <label for="baseline">Baseline</label>
          <select id="baseline">
            <option value="2016" selected>2016</option>
            <option value="2018">2018</option>
            <option value="2020">2020</option>
          </select>
        </div>
        <div class="row" style="margin-bottom:0;">
          <label for="target">Target</label>
          <select id="target">
            <option value="2022">2022</option>
            <option value="2024" selected>2024</option>
            <option value="2026">2026</option>
          </select>
        </div>
      </div>
      <button id="runBtn" type="button">Run Analysis</button>
      <div id="stats" class="stats"></div>
      <div id="status">Ready.</div>

      <div class="legend">
        <div><strong>Shoreline Expansion Index</strong></div>
        <div class="legend-bar"></div>
        <div class="legend-labels"><span>Low (0.0)</span><span>Moderate (0.5)</span><span>High (1.0)</span></div>
        <div class="legend-point"><span class="dot"></span><span>OSM Roads, Schools &amp; Clinics</span></div>
      </div>

      <div class="tools">
        <div><strong>Tools</strong></div>
        <div class="tools-grid">
          <button data-tool="stats" type="button">Stats</button>
          <button data-tool="rules" type="button">Rules</button>
          <button data-tool="diff" type="button">Diff</button>
          <button data-tool="animate" type="button">Animate</button>
          <button data-tool="compare" type="button">Compare</button>
          <button data-tool="nearby" type="button">Nearby</button>
          <button data-tool="share" type="button">Share</button>
          <button data-tool="bookmarks" type="button">Bookmarks</button>
          <button data-tool="export" type="button">Export</button>
          <button data-tool="diagnostics" type="button">Log</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-content">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ------------------------------------------------------------------
    // 1. Event bus — the only shared dependency between microliths
    // ------------------------------------------------------------------
    const handlers = new Map();
    function on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return () => handlers.get(evt).delete(fn);
    }
    function emit(evt, data) {
      for (const fn of handlers.get(evt) ?? []) {
        try { fn(data); } catch (e) { console.error(e); }
      }
    }

    // ------------------------------------------------------------------
    // 2. Config
    // ------------------------------------------------------------------
    const CONFIG = {
      token: 'fc_3sqK2q2tjzM97dn1wLHoP6',
      baseUrl: 'https://udf.ai',
      udfs: { water: 'lake_water_change', infra: 'lake_flood_exposure' }
    };
    const centers = {
      naivasha: [36.34, -0.77, 10.5],
      nakuru:   [36.08, -0.36, 11.0],
      baringo:  [36.07,  0.61, 10.0]
    };

    // ------------------------------------------------------------------
    // 3. Persistent store — IndexedDB
    // ------------------------------------------------------------------
    const DB_NAME = 'rift-monitor';
    let dbPromise;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('responses'))  db.createObjectStore('responses', { keyPath: 'key' });
            if (!db.objectStoreNames.contains('bookmarks'))  db.createObjectStore('bookmarks', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('snapshots'))  db.createObjectStore('snapshots', { keyPath: 'key' });
            if (!db.objectStoreNames.contains('diagnostics')) db.createObjectStore('diagnostics', { keyPath: 'id', autoIncrement: true });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }
    function idbPut(store, value) {
      return getDB().then(db => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      }));
    }
    function idbGet(store, key) {
      return getDB().then(db => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const r = tx.objectStore(store).get(key);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }));
    }
    function idbGetAll(store) {
      return getDB().then(db => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const r = tx.objectStore(store).getAll();
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }));
    }
    function idbDelete(store, key) {
      return getDB().then(db => new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      }));
    }

    // ------------------------------------------------------------------
    // 4. Hashing (SubtleCrypto)
    // ------------------------------------------------------------------
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ------------------------------------------------------------------
    // 5. Cache API — browser-managed geojson cache
    // ------------------------------------------------------------------
    const CACHE_NAME = 'rift-geojson-v1';
    async function cacheGet(url) {
      if (!('caches' in window)) return null;
      try { const c = await caches.open(CACHE_NAME); const r = await c.match(url); return r ? r.json() : null; } catch { return null; }
    }
    async function cachePut(url, data) {
      if (!('caches' in window)) return;
      try {
        const c = await caches.open(CACHE_NAME);
        await c.put(url, new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } }));
      } catch {}
    }

    // ------------------------------------------------------------------
    // 6. Persistent response layer — hash-skip unchanged payloads
    // ------------------------------------------------------------------
    async function persistResponse(key, data) {
      try {
        const hash = await sha256(JSON.stringify(data));
        const existing = await idbGet('responses', key);
        if (existing && existing.hash === hash) return false;
        await idbPut('responses', { key, hash, data, ts: Date.now() });
        return true;
      } catch { return false; }
    }
    function loadPersisted(key) {
      return idbGet('responses', key).then(r => r ? r.data : null).catch(() => null);
    }

    // ------------------------------------------------------------------
    // 7. Request scheduler — concurrency + exponential backoff
    // ------------------------------------------------------------------
    class Scheduler {
      constructor({ concurrency = 2, maxRetries = 3 } = {}) {
        this.concurrency = concurrency;
        this.maxRetries = maxRetries;
        this.queue = [];
        this.active = 0;
      }
      run(fn) {
        return new Promise((resolve, reject) => {
          this.queue.push({ fn, resolve, reject, attempt: 0 });
          this._pump();
        });
      }
      _pump() {
        while (this.active < this.concurrency && this.queue.length) {
          const job = this.queue.shift();
          this.active++;
          this._exec(job).finally(() => { this.active--; this._pump(); });
        }
      }
      async _exec(job) {
        try { job.resolve(await job.fn()); }
        catch (e) {
          const retriable = /HTTP (429|5\d\d)/.test(e.message);
          if (retriable && job.attempt < this.maxRetries) {
            job.attempt++;
            const delay = Math.min(30000, 500 * Math.pow(2, job.attempt));
            setTimeout(() => this._exec(job), delay);
          } else {
            job.reject(e);
          }
        }
      }
    }
    const scheduler = new Scheduler();

    // ------------------------------------------------------------------
    // 8. Web Worker — parsing, stats, diffs off main thread
    // ------------------------------------------------------------------
    const workerSrc = `
      self.onmessage = function (e) {
        var id = e.data.id, op = e.data.op, payload = e.data.payload;
        try {
          var result;
          if (op === 'stats') result = computeStats(payload);
          else if (op === 'diff') result = computeDiff(payload.prev, payload.next);
          else if (op === 'histogram') result = computeHistogram(payload.data, payload.bins);
          self.postMessage({ id: id, result: result });
        } catch (err) {
          self.postMessage({ id: id, error: String((err && err.message) || err) });
        }
      };
      function computeStats(fc) {
        if (!fc || !fc.features) return { count: 0, mean: 0, min: 0, max: 0, over50: 0, over80: 0 };
        var sum = 0, max = -Infinity, min = Infinity, over80 = 0, over50 = 0, n = 0;
        for (var i = 0; i < fc.features.length; i++) {
          var v = Number(fc.features[i].properties && fc.features[i].properties.expansion_index);
          if (isFinite(v)) { sum += v; n++; if (v > max) max = v; if (v < min) min = v; if (v >= 0.8) over80++; if (v >= 0.5) over50++; }
        }
        return { count: fc.features.length, mean: n ? sum / n : 0, min: isFinite(min) ? min : 0, max: isFinite(max) ? max : 0, over50: over50, over80: over80 };
      }
      function computeDiff(prev, next) {
        var key = function (f) { return (f.properties && f.properties.hex) || JSON.stringify(f.geometry && f.geometry.coordinates); };
        var prevMap = new Map(((prev && prev.features) || []).map(function (f) { return [key(f), f]; }));
        var added = [], changed = [], removed = [];
        var nextF = (next && next.features) || [];
        for (var i = 0; i < nextF.length; i++) {
          var f = nextF[i], k = key(f), p = prevMap.get(k);
          if (!p) added.push(f);
          else if (Number(p.properties.expansion_index) !== Number(f.properties.expansion_index)) changed.push(f);
          prevMap.delete(k);
        }
        removed = Array.from(prevMap.values());
        return { added: added.length, removed: removed.length, changed: changed.length, changedFeatures: changed.slice(0, 30) };
      }
      function computeHistogram(data, bins) {
        var out = new Array(bins).fill(0), n = 0;
        for (var i = 0; i < data.length; i++) {
          var v = data[i];
          if (isFinite(v)) { var idx = Math.min(bins - 1, Math.max(0, Math.floor(v * bins))); out[idx]++; n++; }
        }
        return { bins: out, total: n };
      }
    `;
    const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' })));
    let wReqId = 0;
    const wPending = new Map();
    worker.onmessage = (e) => {
      const { id, result, error } = e.data;
      const p = wPending.get(id);
      if (!p) return;
      wPending.delete(id);
      if (error) p.reject(new Error(error)); else p.resolve(result);
    };
    function workerCall(op, payload) {
      const id = ++wReqId;
      return new Promise((resolve, reject) => {
        wPending.set(id, { resolve, reject });
        worker.postMessage({ id, op, payload });
      });
    }

    // ------------------------------------------------------------------
    // 9. Diagnostics buffer
    // ------------------------------------------------------------------
    function logDiag(entry) {
      idbPut('diagnostics', Object.assign({ ts: Date.now() }, entry)).catch(() => {});
    }

    // ------------------------------------------------------------------
    // 10. State
    // ------------------------------------------------------------------
    let currentLake = 'naivasha';
    let currentBaseline = 2016;
    let currentTarget = 2024;
    let currentWater = { type: 'FeatureCollection', features: [] };
    let currentInfra = { type: 'FeatureCollection', features: [] };
    const memCache = new Map();

    // ------------------------------------------------------------------
    // 11. Map
    // ------------------------------------------------------------------
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [36.34, -0.77],
      zoom: 10.5,
      preserveDrawingBuffer: true
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    function addOverlayLayers() {
      if (!map.getSource('water-hex')) map.addSource('water-hex', { type: 'geojson', data: currentWater });
      else map.getSource('water-hex').setData(currentWater);
      if (!map.getLayer('water-hex-fill')) map.addLayer({
        id: 'water-hex-fill', type: 'fill', source: 'water-hex',
        paint: {
          'fill-color': ['interpolate', ['linear'], ['get', 'expansion_index'], 0, '#38bdf8', 0.5, '#f59e0b', 1.0, '#dc2626'],
          'fill-opacity': 0.45
        }
      });
      if (!map.getLayer('water-hex-outline')) map.addLayer({
        id: 'water-hex-outline', type: 'line', source: 'water-hex',
        paint: { 'line-color': '#0f172a', 'line-width': 0.4, 'line-opacity': 0.35 }
      });
      if (!map.getSource('infra-pts')) map.addSource('infra-pts', { type: 'geojson', data: currentInfra });
      else map.getSource('infra-pts').setData(currentInfra);
      if (!map.getLayer('infra-pts-circle')) map.addLayer({
        id: 'infra-pts-circle', type: 'circle', source: 'infra-pts',
        paint: { 'circle-radius': 5, 'circle-color': '#111827', 'circle-stroke-color': '#f8fafc', 'circle-stroke-width': 1.5 }
      });
    }

    // ------------------------------------------------------------------
    // 12. Fetch pipeline: mem -> IndexedDB -> Cache API -> network
    // ------------------------------------------------------------------
    function buildUrl(udf, lake, b, t) {
      return `${CONFIG.baseUrl}/${CONFIG.token}/${udf}.geojson?lake=${encodeURIComponent(lake)}&baseline_year=${b}&target_year=${t}&cache_max_age=2592000`;
    }
    async function fetchUdf(udf, lake, b, t) {
      const url = buildUrl(udf, lake, b, t);
      const key = `${udf}|${lake}|${b}|${t}`;
      const mem = memCache.get(key);
      if (mem) return mem;
      const persisted = await loadPersisted(key);
      if (persisted) { memCache.set(key, persisted); return persisted; }
      const cached = await cacheGet(url);
      if (cached) { memCache.set(key, cached); return cached; }
      const t0 = performance.now();
      const res = await scheduler.run(() => fetch(url));
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) {
        await logDiag({ type: 'http', url, status: res.status, ms });
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      await cachePut(url, data);
      await persistResponse(key, data);
      memCache.set(key, data);
      await logDiag({ type: 'fetch', url, ms, status: res.status });
      return data;
    }

    // ------------------------------------------------------------------
    // 13. UI helpers — modal, toast, status
    // ------------------------------------------------------------------
    function setStatus(msg) { const el = document.getElementById('status'); if (el) el.textContent = msg; }
    function showModal(html) {
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modal').hidden = false;
    }
    function hideModal() { document.getElementById('modal').hidden = true; }
    function toast(msg, ms = 2200) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, ms);
    }

    // ------------------------------------------------------------------
    // 14. Rules engine — presets -> MapLibre filters
    // ------------------------------------------------------------------
    const RULE_PRESETS = {
      none:            { label: 'No filter',                       filter: null },
      high:            { label: 'High expansion (>0.8)',           filter: ['>', ['get', 'expansion_index'], 0.8] },
      mid:             { label: 'Moderate (0.5–0.8)',              filter: ['all', ['>=', ['get', 'expansion_index'], 0.5], ['<', ['get', 'expansion_index'], 0.8]] },
      low:             { label: 'Low (<0.5)',                      filter: ['<', ['get', 'expansion_index'], 0.5] },
      'asset-school':  { label: 'Exposed schools (asset)',         filter: null /* applied to infra layer below */ }
    };
    function applyRule(key) {
      const preset = RULE_PRESETS[key];
      if (!preset) return;
      if (key === 'asset-school') {
        if (map.getLayer('infra-pts-circle')) map.setFilter('infra-pts-circle', ['==', ['get', 'category'], 'school']);
        toast('Infra filter: schools');
        return;
      }
      if (map.getLayer('water-hex-fill')) map.setFilter('water-hex-fill', preset.filter);
      if (map.getLayer('infra-pts-circle')) map.setFilter('infra-pts-circle', null);
      toast(`Water filter: ${preset.label}`);
    }

    // ------------------------------------------------------------------
    // 15. Diff — compare against last snapshot
    // ------------------------------------------------------------------
    async function saveSnapshot() {
      const key = `snap|${currentLake}|${currentBaseline}|${currentTarget}`;
      await idbPut('snapshots', { key, data: currentWater, ts: Date.now() });
    }
    async function showDiff() {
      const key = `snap|${currentLake}|${currentBaseline}|${currentTarget}`;
      const prev = await idbGet('snapshots', key).then(r => r && r.data).catch(() => null);
      if (!prev) {
        showModal('<h3>No previous snapshot</h3><p>Run the analysis once, then again later. The diff compares the current result against the last saved snapshot for this lake and year pair.</p>');
        return;
      }
      const d = await workerCall('diff', { prev, next: currentWater });
      showModal(`<h3>Changes since last snapshot</h3>
        <p>Added: <strong>${d.added}</strong><br/>Removed: <strong>${d.removed}</strong><br/>Changed: <strong>${d.changed}</strong></p>
        ${d.changedFeatures.length ? '<p>Sample of changed cells:</p><ul>' + d.changedFeatures.slice(0, 10).map(f => `<li>${f.properties.hex || '?'} — ${Number(f.properties.expansion_index).toFixed(3)}</li>`).join('') + '</ul>' : ''}
        <p style="color:#94a3b8;font-size:11px">Snapshot age: ${new Date(prev.ts).toLocaleString()}</p>`);
    }

    // ------------------------------------------------------------------
    // 16. Time-series animation
    // ------------------------------------------------------------------
    let anim = { running: false, timer: null };
    async function playAnimation() {
      if (anim.running) { stopAnimation(); return; }
      const years = [];
      for (let y = currentBaseline + 2; y <= currentTarget; y += 2) years.push(y);
      if (!years.length) { toast('Target must be at least 2 years after baseline'); return; }
      anim.running = true;
      toast(`Loading ${years.length} frame(s)...`);
      try {
        const frames = await Promise.all(years.map(y => fetchUdf(CONFIG.udfs.water, currentLake, currentBaseline, y)));
        let i = 0;
        const step = () => {
          if (!anim.running) return;
          map.getSource('water-hex')?.setData(frames[i % frames.length]);
          i++;
          anim.timer = setTimeout(step, 1200);
        };
        step();
      } catch (e) {
        stopAnimation();
        toast(`Animation failed: ${e.message}`);
      }
    }
    function stopAnimation() {
      anim.running = false;
      if (anim.timer) clearTimeout(anim.timer);
      map.getSource('water-hex')?.setData(currentWater);
      toast('Animation stopped');
    }

    // ------------------------------------------------------------------
    // 17. Multi-lake comparison with canvas histograms
    // ------------------------------------------------------------------
    async function showCompare() {
      const lakes = ['naivasha', 'nakuru', 'baringo'];
      setStatus('Loading all lakes...');
      try {
        const datasets = await Promise.all(lakes.map(l => fetchUdf(CONFIG.udfs.water, l, currentBaseline, currentTarget)));
        const stats = await Promise.all(datasets.map(d => workerCall('stats', d)));
        const rows = lakes.map((l, i) => `<tr><td>${l}</td><td>${stats[i].count}</td><td>${stats[i].mean.toFixed(2)}</td><td>${stats[i].max.toFixed(2)}</td><td>${stats[i].over80}</td></tr>`).join('');
        showModal(`<h3>Lake comparison (${currentBaseline}–${currentTarget})</h3>
          <table class="tbl"><thead><tr><th>Lake</th><th>Cells</th><th>Mean</th><th>Max</th><th>&gt;0.8</th></tr></thead><tbody>${rows}</tbody></table>
          <canvas id="compareChart" width="560" height="200" style="width:100%;max-width:560px;margin-top:12px;background:#0b1220;border-radius:8px"></canvas>
          <p style="color:#94a3b8;font-size:11px">Bars per bin: Naivasha (blue), Nakuru (amber), Baringo (red).</p>`);
        await drawHistograms(datasets, 'compareChart');
        setStatus('Ready.');
      } catch (e) {
        setStatus('Compare failed: ' + e.message);
      }
    }
    async function drawHistograms(datasets, canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const colors = ['#38bdf8', '#f59e0b', '#dc2626'];
      const bins = 10;
      const all = await Promise.all(datasets.map(d =>
        workerCall('histogram', { data: (d.features || []).map(f => Number(f.properties.expansion_index)), bins })
      ));
      const maxCount = Math.max(1, ...all.flatMap(a => a.bins));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barW = (canvas.width - 40) / bins;
      const pad = 20;
      for (let b = 0; b < bins; b++) {
        const groupW = barW * 0.8;
        const x0 = pad + b * barW;
        all.forEach((a, i) => {
          const h = (a.bins[b] / maxCount) * (canvas.height - 40);
          ctx.fillStyle = colors[i];
          ctx.fillRect(x0 + (groupW / all.length) * i, canvas.height - pad - h, groupW / all.length - 2, h);
        });
      }
      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px system-ui';
      for (let b = 0; b <= bins; b++) {
        const x = pad + b * barW;
        ctx.fillText((b / bins).toFixed(1), x - 8, canvas.height - 4);
      }
    }

    // ------------------------------------------------------------------
    // 18. Nearby exposure — geolocation + haversine
    // ------------------------------------------------------------------
    function haversine(lon1, lat1, lon2, lat2) {
      const R = 6371000, toRad = Math.PI / 180;
      const dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    function showNearby() {
      if (!currentInfra.features || !currentInfra.features.length) { toast('No infrastructure loaded'); return; }
      if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
      setStatus('Locating...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          const items = currentInfra.features
            .map(f => {
              const [lon, lat] = f.geometry.coordinates;
              return { f, dist: haversine(longitude, latitude, lon, lat) };
            })
            .sort((a, b) => a.dist - b.dist)
            .slice(0, 15);
          showModal(`<h3>Nearby exposed assets</h3>
            <p>From ${latitude.toFixed(4)}, ${longitude.toFixed(4)}</p>
            <table class="tbl"><thead><tr><th>Name</th><th>Category</th><th>Score</th><th>Distance</th></tr></thead>
            <tbody>${items.map(({ f, dist }) => `<tr><td>${f.properties.name || '—'}</td><td>${f.properties.category || '—'}</td><td>${f.properties.exposure_score ?? '—'}</td><td>${(dist / 1000).toFixed(2)} km</td></tr>`).join('')}</tbody></table>`);
          setStatus('Ready.');
        },
        (err) => { setStatus('Location error: ' + err.message); },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // ------------------------------------------------------------------
    // 19. Shareable state in URL fragment (CompressionStream)
    // ------------------------------------------------------------------
    async function encodeState(state) {
      const json = JSON.stringify(state);
      if (typeof CompressionStream === 'undefined') return 'j' + btoa(unescape(encodeURIComponent(json)));
      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      return 'c' + btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
    async function decodeState(str) {
      try {
        if (str[0] === 'j') return JSON.parse(decodeURIComponent(escape(atob(str.slice(1)))));
        if (str[0] === 'c') {
          const s = str.slice(1).replace(/-/g, '+').replace(/_/g, '/');
          const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
          const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
          if (typeof DecompressionStream === 'undefined') return null;
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          return JSON.parse(await new Response(stream).text());
        }
      } catch {}
      return null;
    }
    function currentState() {
      const c = map.getCenter();
      return {
        lake: currentLake,
        baseline: currentBaseline,
        target: currentTarget,
        basemap: document.getElementById('basemap').value,
        center: [c.lng, c.lat],
        zoom: map.getZoom()
      };
    }
    async function applySharedState() {
      const params = new URLSearchParams(location.search);
      const lakeQ = params.get('lake');
      if (lakeQ && centers[lakeQ]) {
        document.getElementById('lake').value = lakeQ;
        const [lon, lat, zoom] = centers[lakeQ];
        map.jumpTo({ center: [lon, lat], zoom });
      }
      const bQ = params.get('baseline_year');
      if (bQ) document.getElementById('baseline').value = bQ;
      const tQ = params.get('target_year');
      if (tQ) document.getElementById('target').value = tQ;

      const m = location.hash.match(/^#s=(.+)$/);
      if (!m) return;
      const state = await decodeState(m[1]);
      if (!state) return;
      if (state.lake && centers[state.lake]) document.getElementById('lake').value = state.lake;
      if (state.baseline) document.getElementById('baseline').value = String(state.baseline);
      if (state.target) document.getElementById('target').value = String(state.target);
      if (state.basemap) document.getElementById('basemap').value = state.basemap;
      if (state.center) map.jumpTo({ center: state.center, zoom: state.zoom ?? map.getZoom() });
    }

    // ------------------------------------------------------------------
    // 20. Bookmarks
    // ------------------------------------------------------------------
    async function showBookmarks() {
      const list = await idbGetAll('bookmarks').catch(() => []);
      showModal(`<h3>Bookmarks</h3>
        <button id="bmSave" type="button" style="width:100%">Save current view</button>
        <ul class="bm-list">${list.length ? list.map(b => `<li><a href="#s=${b.enc}">${escapeHtml(b.label)}</a> <button class="bm-del" data-id="${b.id}" type="button" aria-label="Delete">×</button></li>`).join('') : '<li>No bookmarks yet.</li>'}</ul>`);
      document.getElementById('bmSave').onclick = async () => {
        const label = prompt('Bookmark name', `${currentLake} ${currentBaseline}-${currentTarget}`);
        if (!label) return;
        const enc = await encodeState(currentState());
        await idbPut('bookmarks', { label, enc, ts: Date.now() });
        toast('Bookmark saved');
        hideModal();
      };
      document.querySelectorAll('.bm-del').forEach(btn => {
        btn.onclick = async () => { await idbDelete('bookmarks', Number(btn.dataset.id)); showBookmarks(); };
      });
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ------------------------------------------------------------------
    // 21. Zonal stats
    // ------------------------------------------------------------------
    async function showStats() {
      const s = await workerCall('stats', currentWater);
      const assets = currentInfra.features ? currentInfra.features.length : 0;
      showModal(`<h3>Zonal statistics — ${currentLake} ${currentBaseline}–${currentTarget}</h3>
        <table class="tbl">
          <tr><th>H3 cells</th><td>${s.count}</td></tr>
          <tr><th>Mean expansion</th><td>${s.mean.toFixed(3)}</td></tr>
          <tr><th>Max</th><td>${s.max.toFixed(3)}</td></tr>
          <tr><th>Min</th><td>${s.min.toFixed(3)}</td></tr>
          <tr><th>Cells &gt; 0.5</th><td>${s.over50}</td></tr>
          <tr><th>Cells &gt; 0.8</th><td>${s.over80}</td></tr>
          <tr><th>Exposed assets</th><td>${assets}</td></tr>
        </table>`);
    }

    // ------------------------------------------------------------------
    // 22. Export — GeoJSON, CSV, PNG
    // ------------------------------------------------------------------
    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    function exportGeoJSON() {
      download(new Blob([JSON.stringify(currentWater)], { type: 'application/geo+json' }),
        `water-${currentLake}-${currentBaseline}-${currentTarget}.geojson`);
    }
    function exportCSV() {
      const rows = [['hex', 'expansion_index', 'baseline_year', 'target_year', 'base_scenes', 'curr_scenes']];
      for (const f of currentWater.features || []) {
        const p = f.properties || {};
        rows.push([p.hex, p.expansion_index, p.baseline_year, p.target_year, p.base_scenes, p.curr_scenes]);
      }
      const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      download(new Blob([csv], { type: 'text/csv' }), `stats-${currentLake}-${currentBaseline}-${currentTarget}.csv`);
    }
    function exportPNG() {
      map.getCanvas().toBlob(b => download(b, `map-${currentLake}-${currentBaseline}-${currentTarget}.png`), 'image/png');
    }
    function showExport() {
      showModal(`<h3>Export</h3>
        <button id="expGeo" type="button" style="width:100%;margin:4px 0">GeoJSON (water)</button>
        <button id="expCsv" type="button" style="width:100%;margin:4px 0">CSV (stats)</button>
        <button id="expPng" type="button" style="width:100%;margin:4px 0">PNG (map)</button>`);
      document.getElementById('expGeo').onclick = exportGeoJSON;
      document.getElementById('expCsv').onclick = exportCSV;
      document.getElementById('expPng').onclick = exportPNG;
    }

    // ------------------------------------------------------------------
    // 23. Diagnostics viewer
    // ------------------------------------------------------------------
    async function showDiagnostics() {
      const rows = await idbGetAll('diagnostics').catch(() => []);
      const recent = rows.sort((a, b) => b.ts - a.ts).slice(0, 30);
      const storage = navigator.storage?.estimate ? await navigator.storage.estimate().catch(() => null) : null;
      showModal(`<h3>Diagnostics</h3>
        ${storage ? `<p>Storage: ${(storage.usage / 1024 / 1024).toFixed(1)} MB / ${(storage.quota / 1024 / 1024 / 1024).toFixed(1)} GB</p>` : ''}
        <table class="tbl"><thead><tr><th>Time</th><th>Type</th><th>URL / Status</th><th>ms</th></tr></thead>
        <tbody>${recent.map(r => `<tr><td>${new Date(r.ts).toLocaleTimeString()}</td><td>${r.type}</td><td>${escapeHtml((r.url || '').slice(0, 40))} ${r.status || ''}</td><td>${r.ms ? Math.round(r.ms) : ''}</td></tr>`).join('') || '<tr><td colspan="4">No entries.</td></tr>'}</tbody></table>
        <button id="diagClear" type="button" style="width:100%">Clear log</button>`);
      document.getElementById('diagClear').onclick = async () => {
        const db = await getDB();
        const tx = db.transaction('diagnostics', 'readwrite');
        tx.objectStore('diagnostics').clear();
        tx.oncomplete = () => { hideModal(); toast('Log cleared'); };
      };
    }

    // ------------------------------------------------------------------
    // 24. Web Share
    // ------------------------------------------------------------------
    async function shareCurrent() {
      const enc = await encodeState(currentState());
      const url = `${location.origin}${location.pathname}#s=${enc}`;
      history.replaceState(null, '', '#s=' + enc);
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Rift Valley Lake Monitor', text: `${currentLake} ${currentBaseline}-${currentTarget}`, url });
          return;
        } catch {}
      }
      try {
        await navigator.clipboard.writeText(url);
        toast('Share link copied');
      } catch {
        showModal(`<p>Copy this link:</p><textarea readonly style="width:100%;height:120px" onclick="this.select()">${escapeHtml(url)}</textarea>`);
      }
    }

    // ------------------------------------------------------------------
    // 25. Load pipeline
    // ------------------------------------------------------------------
    async function loadLayers() {
      const lake = document.getElementById('lake').value;
      const b = parseInt(document.getElementById('baseline').value, 10);
      const t = parseInt(document.getElementById('target').value, 10);
      if (t <= b) { setStatus('Target year must be later than baseline year.'); return; }

      currentLake = lake; currentBaseline = b; currentTarget = t;
      const [lon, lat, zoom] = centers[lake];
      map.flyTo({ center: [lon, lat], zoom });

      if (window.matchMedia('(max-width: 600px)').matches) {
        const panel = document.getElementById('panel');
        if (!panel.classList.contains('collapsed')) {
          panel.classList.add('collapsed');
          const tg = document.getElementById('panelToggle');
          tg.setAttribute('aria-expanded', 'false');
          tg.textContent = '▸';
        }
      }

      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      setStatus('Loading...');
      try {
        const [g1, g2] = await Promise.all([
          fetchUdf(CONFIG.udfs.water, lake, b, t),
          fetchUdf(CONFIG.udfs.infra, lake, b, t)
        ]);
        currentWater = g1;
        currentInfra = g2;
        map.getSource('water-hex')?.setData(g1);
        map.getSource('infra-pts')?.setData(g2);
        await saveSnapshot();
        const stats = document.getElementById('stats');
        stats.style.display = 'block';
        stats.textContent = `${lake.toUpperCase()} ${b}-${t}: ${g1.features?.length ?? 0} cells, ${g2.features?.length ?? 0} assets`;
        setStatus('Loaded.');
        emit('query:done', { lake, b, t });
      } catch (e) {
        setStatus('Failed: ' + e.message);
        await logDiag({ type: 'error', url: e.message });
        emit('query:error', e);
      } finally {
        btn.disabled = false;
      }
    }

    // ------------------------------------------------------------------
    // 26. Wiring
    // ------------------------------------------------------------------
    document.getElementById('modalClose').addEventListener('click', hideModal);
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') hideModal();
    });
    document.getElementById('panelToggle').addEventListener('click', () => {
      const panel = document.getElementById('panel');
      const tg = document.getElementById('panelToggle');
      const collapsed = panel.classList.toggle('collapsed');
      tg.setAttribute('aria-expanded', String(!collapsed));
      tg.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel');
      tg.textContent = collapsed ? '▸' : '▾';
    });
    document.getElementById('runBtn').addEventListener('click', loadLayers);
    document.getElementById('basemap').addEventListener('change', () => {
      map.setStyle(document.getElementById('basemap').value);
      map.once('style.load', addOverlayLayers);
    });
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.tool;
        if (t === 'stats') showStats();
        else if (t === 'rules') showRules();
        else if (t === 'diff') showDiff();
        else if (t === 'animate') playAnimation();
        else if (t === 'compare') showCompare();
        else if (t === 'nearby') showNearby();
        else if (t === 'share') shareCurrent();
        else if (t === 'bookmarks') showBookmarks();
        else if (t === 'export') showExport();
        else if (t === 'diagnostics') showDiagnostics();
      });
    });
    function showRules() {
      showModal(`<h3>Rules</h3>
        <p>Apply a preset filter to the shoreline and infrastructure layers.</p>
        <select id="ruleSelect" style="width:100%;padding:8px;margin:8px 0;font-size:14px">
          ${Object.entries(RULE_PRESETS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}
        </select>
        <button id="ruleApply" type="button" style="width:100%">Apply</button>`);
      document.getElementById('ruleApply').onclick = () => {
        applyRule(document.getElementById('ruleSelect').value);
        hideModal();
      };
    }

    map.on('load', () => {
      addOverlayLayers();
      map.on('click', 'infra-pts-circle', (e) => {
        const f = e.features[0], p = f.properties;
        new maplibregl.Popup().setLngLat(f.geometry.coordinates).setHTML(
          `<div style="font-size:12px;color:#0f172a;"><strong>${p.name || 'Infrastructure'}</strong><br/>Category: ${p.category || 'N/A'}<br/>Exposure: <strong>${p.exposure_score ?? 'N/A'}</strong></div>`
        ).addTo(map);
      });
      map.on('click', 'water-hex-fill', (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
          `<div style="font-size:12px;color:#0f172a;"><strong>H3: ${p.hex}</strong><br/>Expansion: <strong>${p.expansion_index}</strong><br/>WOfS: ${p.base_scenes} → ${p.curr_scenes}</div>`
        ).addTo(map);
      });
      map.on('mouseenter', 'infra-pts-circle', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'infra-pts-circle', () => map.getCanvas().style.cursor = '');
      applySharedState();
    });

    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  })();
  </script>
